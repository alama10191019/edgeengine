.note{color:var(--text2);font-size:13px}.warnbox{border-left:3px solid var(--warn);background:var(--surface);padding:9px 12px;border-radius:6px;color:var(--text2);font-size:13px;margin:10px 0}

// ---- Best Odds: the same outcome priced at every place we have a price for
const p2am=p=>p>0&&p<1?toAm(1/p):null;
function venues(g,mkt,side){
  const v={}, o=g.odds||{}, dk={ml:{home:o.ml_h,away:o.ml_a,draw:o.ml_d},spread:{home:o.sp_h,away:o.sp_a},total:{over:o.tot_o,under:o.tot_u}}[mkt][side];
  if(dk!=null) v[g.book||"Sportsbook"]=dk;
  const ob=((g.ob||{})[mkt]||{})[side]||{}; for(const k in ob) if(ob[k]!=null&&!(k in v)) v[k]=ob[k];
  if(mkt==="ml"){ for(const [nm,key] of [["Kalshi","kalshi"],["Polymarket","poly"]]){const a=(((g.mk||{})[key]||{}).ask||{})[side], am_=a!=null?p2am(a):null; if(am_!=null) v[nm]=am_} }
  return v;
}
function sideProb(g,mkt,side){
  const pk=g.picks.find(p=>p.mkt===mkt); if(!pk) return null;
  if(pk.sel===side) return pk.p;
  if(mkt!=="ml"||g.sp!=="soccer") return 1-pk.p;
  const pr={home:g.proj.p_h,draw:g.proj.p_d,away:g.proj.p_a}, rest=Object.keys(pr).filter(k=>k!==pk.sel).reduce((a,k)=>a+pr[k],0);
  return rest>0?(1-pk.p)*pr[side]/rest:null;
}
function oddsRows(g){
  const o=g.odds||{}, rows=[], add=(mkt,side,label)=>{const v=venues(g,mkt,side), ks=Object.keys(v); if(!ks.length) return;
    const best=ks.reduce((a,k)=>dec(v[k])>dec(v[a])?k:a,ks[0]), worst=ks.reduce((a,k)=>dec(v[k])<dec(v[a])?k:a,ks[0]), p=sideProb(g,mkt,side);
    rows.push({g,mkt,side,label,v,n:ks.length,best,gap:(dec(v[best])-dec(v[worst]))*100,p,edge:p!=null?p-1/dec(v[best]):null})};
  add("ml","away",g.away.a+" to win"); if(g.sp==="soccer") add("ml","draw","Draw"); add("ml","home",g.home.a+" to win");

  if(o.tot!=null){add("total","over","Over "+o.tot); add("total","under","Under "+o.tot)}
  return rows;
}
function bestOdds(){
  const q=S.q.trim().toLowerCase();
  const all=DATA.games.filter(g=>(S.osp==="all"||g.sp===S.osp)), days=[...new Set(all.map(g=>dayKey(g.date)))];
  if(S.day!=="all"&&!days.includes(S.day)) S.day="all";
  const gs=all.filter(g=>(S.day==="all"||dayKey(g.date)===S.day)&&(!q||(g.home.n+" "+g.away.n+" "+g.home.a+" "+g.away.a+" "+g.league).toLowerCase().includes(q)));
  const per=gs.map(g=>({g,rows:oddsRows(g)})).map(x=>({...x,multi:x.rows.filter(r=>r.n>1)})).filter(x=>x.multi.length);
  const flat=per.flatMap(x=>x.multi), ipGap=r=>{const ks=Object.keys(r.v),w=ks.reduce((a,k)=>dec(r.v[k])<dec(r.v[a])?k:a,ks[0]);return 1/dec(r.v[w])-1/dec(r.v[r.best])}, gaps=flat.filter(r=>1/dec(r.v[r.best])>=0.2).sort((a,b)=>ipGap(b)-ipGap(a)).slice(0,8), vals=flat.filter(r=>r.edge!=null&&r.edge>0&&r.p>=0.4).sort((a,b)=>b.edge-a.edge).slice(0,8);
  const bm=DATA.books_meta||{}, c=(v,l)=>`<button class="chip ${S.osp===v?"on":""}" data-set="osp" data-v="${v}">${l}</button>`;
  const names=new Set(); flat.forEach(r=>Object.keys(r.v).forEach(k=>names.add(k)));
  const line=r=>`<tr><td>${h(r.label)}<br><span class="pm">${h(r.g.away.a)} at ${h(r.g.home.a)} &middot; ${SP[r.g.sp]} &middot; ${tm(r.g.date)}</span></td><td><b>${h(r.best)}</b>${r.best==="Polymarket"&&r.g.mk&&r.g.mk.poly?"<br>"+trade(pmUrl(r.g.mk.poly.slug),"Polymarket"):r.best==="Kalshi"&&r.g.mk&&r.g.mk.kalshi?"<br>"+trade(kUrl(r.g.mk.kalshi.series),"Kalshi"):""}</td><td class="num"><b>${am(r.v[r.best])}</b></td><td class="num">$${(100*dec(r.v[r.best])-100).toFixed(0)}</td><td class="num">+$${r.gap.toFixed(0)}</td><td class="num">${r.p!=null?pct(r.p):"n/a"}</td><td class="num">${r.edge!=null?(r.edge>=0?"+":"")+(r.edge*100).toFixed(1):"n/a"}</td></tr>`;
  const head=`<tr><th>Bet</th><th>Best place</th><th class="num">Best odds</th><th class="num">Profit on $100</th><th class="num">Extra vs worst</th><th class="num">Our chance</th><th class="num">Edge at best</th></tr>`;
  const card=x=>{const cols=[...new Set(x.multi.flatMap(r=>Object.keys(r.v)))];
    return `<div class="card game" style="--sp:var(--${x.g.sp})"><div class="match"><div class="tm" style="margin:0">${av(x.g.away)}<span>${h(x.g.away.n)}</span><span class="pm">at</span>${av(x.g.home)}<span>${h(x.g.home.n)}</span></div><div style="text-align:right"><span class="lgtag"><i></i>${h(x.g.league)}</span><div class="meta">${tm(x.g.date)}</div></div></div>
     <div style="overflow:auto;margin-top:8px"><table><tr><th>Bet</th>${cols.map(k=>`<th class="num">${h(k)}</th>`).join("")}<th class="num">Our chance</th><th class="num">Edge at best</th></tr>
     ${x.multi.map(r=>`<tr><td>${h(r.label)} <span class="pm">${MK[r.mkt]}</span></td>${cols.map(k=>r.v[k]==null?`<td class="num pm">-</td>`:`<td class="num ${k===r.best?"bestcell":""}">${am(r.v[k])}${k===r.best?'<br><span class="bt">Best</span>':""}</td>`).join("")}<td class="num">${r.p!=null?pct(r.p):"n/a"}</td><td class="num">${r.edge!=null?(r.edge>=0?"+":"")+(r.edge*100).toFixed(1):"n/a"}</td></tr>`).join("")}</table></div></div>`};
  return `<details class="help" data-help="1" ${S.help?"open":""}><summary>How to read this page</summary><dl>
    <dt>What it does</dt><dd>Lines up the same bet at every place we have a price for, and marks the one that pays the most.</dd>
    <dt>Best odds</dt><dd>The highest payout for that bet. A bigger plus number, or a smaller minus number, is better for you.</dd>
    <dt>Extra vs worst</dt><dd>How much more a $100 bet would win at the best place than at the worst one.</dd>
    <dt>Edge at best</dt><dd>Our estimated chance minus the chance implied by the best price, in percentage points. Above zero means the price looks favorable by our estimate.</dd>
    <dt>Kalshi and Polymarket</dt><dd>Their prices are converted to odds from the current cost to buy, before trading fees, so the real payout is a little lower. Their rules and availability differ from sportsbooks, and on long shots there may be little money available at the shown price.</dd></dl></details>
  <div class="days">${c("all","All sports")}${["nfl","nba","soccer","cfb"].map(k=>c(k,SP[k])).join("")}</div>
  <div class="days" style="margin-top:8px">${`<button class="chip ${S.day==="all"?"on":""}" data-set="day" data-v="all">All days</button>`}${days.map(d=>`<button class="chip ${S.day===d?"on":""}" data-set="day" data-v="${d}">${dayLabel(d)}</button>`).join("")}</div>
  <div class="tools"><input type="search" id="q" placeholder="Search a team" value="${h(S.q)}" aria-label="Search a team"></div>
  <div class="warnbox">Comparing <b>${[...names].map(h).join(", ")||"no sources"}</b> across ${per.length} games. ${bm.enabled?(bm.asof?`Extra sportsbook prices as of ${tm(bm.asof)}.`:`Extra sportsbook prices could not be loaded${bm.error?" ("+h(bm.error)+")":""}.`):"Only one sportsbook is in the current data. More books (FanDuel, BetMGM, Caesars and others) can be added with a licensed odds feed."} Prices move, so check the book before betting.</div>
  ${flat.length?`<h2>Biggest price differences right now</h2><div class="note" style="margin:-6px 0 10px">Bets priced at a 20% chance or better, where the places disagree most. Long shots are left out because small price gaps look huge on them.</div><div class="card" style="overflow:auto"><table>${head}${gaps.map(line).join("")}</table></div>
  <h2>Best value at the best price</h2><div class="card" style="overflow:auto"><table>${head}${vals.map(line).join("")||'<tr><td colspan="7" class="empty">Nothing above zero edge with these filters.</td></tr>'}</table></div>
  <h2>Every game, side by side</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(480px,1fr))">${per.map(card).join("")}</div>`:`<div class="empty">No games have prices from two or more places with these filters.</div>`}`;
}
function trending(){
  const M=MK_(), kind={moneyline:"Winner",spreads:"Spread",totals:"Total"};
  return mkErr()+mkNote+`<h2>Most traded on Polymarket, last 24 hours</h2><div class="card" style="overflow:auto"><table><tr><th>#</th><th>Market</th><th>Type</th><th>Leading side</th><th class="num">Price</th><th class="num">24h volume</th><th>Starts</th><th></th></tr>

function parlays(){
  const sc=(v,l)=>`<button class="chip ${S.psp===v?"on":""}" data-set="psp" data-v="${v}">${l}</button>`;
  const top=`<div class="days">${sc("all","By day")}${["nfl","nba","soccer","cfb"].map(k=>sc(k,SP[k])).join("")}</div>`;
  if(S.psp!=="all") return top+`<div class="row" style="margin-top:10px"><span class="lab">Stake $</span><select data-sel="stake">${[5,10,20,25,50,100].map(v=>`<option ${v===S.stake?"selected":""}>${v}</option>`).join("")}</select></div>
   <div class="warnbox">Combined chance is each leg's probability multiplied together. Every added leg lowers the chance of hitting, and a negative expected value means the payout does not make up for the risk at these prices.</div>`+sportParlays(S.psp);
  return top+`<div style="height:10px"></div>`+parlaysByDay();
}
function parlaysByDay(){
  const G=DATA.parlays; if(!G.length) return `<div class="empty">Not enough priced games to build parlays right now.</div>`;
  if(S.slate>=G.length) S.slate=0; const g=G[S.slate];
  const lab=t=>t==="week"?"Next 7 days":dayLabel(t);
  let o=`<div class="row"><span class="lab">Slate</span>${G.map((x,i)=>`<button class="chip ${i===S.slate?"on":""}" data-set="slate" data-v="${i}">${lab(x.tag)}</button>`).join("")}
   <span class="lab" style="margin-left:10px">Stake $</span><select data-sel="stake">${[5,10,20,25,50,100].map(v=>`<option ${v===S.stake?"selected":""}>${v}</option>`).join("")}</select></div>
   <div class="warnbox">Combined chance is each leg's probability multiplied together, one leg per game. Every added leg lowers the chance of hitting. A negative expected value means the payout does not compensate for the risk at these prices. Same-game parlay odds are the two prices multiplied; sportsbooks set their own same-game price, usually lower.</div>
   <div class="grid">${g.parlays.map(p=>parlayCard(p,S.stake)).join("")}</div>`;
  const day=g.tag==="week"?null:g.tag;
  const sg=DATA.games.filter(x=>!day||dayKey(x.date)===day).flatMap(x=>x.sgp.filter(c=>c.name==="Safest").map(c=>({...c,g:x}))).sort((a,b)=>b.p-a.p).slice(0,12);
  if(sg.length) o+=`<h2>Most likely same-game parlays on this slate</h2><div class="card" style="overflow:auto"><table><tr><th>Game</th><th>Parlay</th><th class="num">Chance both hit</th><th class="num">Approx. odds</th><th class="num">Fair odds</th><th class="num">Returns on $${S.stake}</th></tr>
    ${sg.map(c=>`<tr><td>${h(c.g.away.n)} at ${h(c.g.home.n)}<br><span class="pm">${h(c.g.league)} &middot; ${tm(c.g.date)}</span></td><td>${h(c.legs[0])} + ${h(c.legs[1])}</td><td class="num">${pct(c.p,1)}</td><td class="num">${am(c.amer)}</td><td class="num">${am(c.fair)}</td><td class="num">$${(S.stake*c.dec).toFixed(2)}</td></tr>`).join("")}</table>
    <div class="pm" style="margin-top:6px">Every game card in the sport tabs has its own same-game parlays (safest, best value, long shot).</div></div>`;
  if(g.rr.length){
    const r0=g.rr[0];
    o+=`<h2>Round robin: top 4 picks in every combination</h2><div class="note">Legs: ${r0.legs.map(l=>`${h(l.label)} (${pct(l.p)}, ${am(l.odds)})`).join(" &middot; ")}</div>
    <div class="card" style="margin-top:8px"><table><tr><th>Format</th><th class="num">Combos</th><th class="num">Total cost</th><th class="num">Average return</th><th class="num">Max return</th><th class="num">Chance of profit</th></tr>
    ${g.rr.map(r=>`<tr><td>By ${r.size}s ($${r.stake} each)</td><td class="num">${r.combos}</td><td class="num">$${r.cost}</td><td class="num">$${r.exp_return.toFixed(2)}</td><td class="num">$${r.max_return.toFixed(2)}</td><td class="num">${pct(r.p_profit,1)}</td></tr>`).join("")}</table>
    <div style="margin-top:10px"><div class="lab">Chance that exactly N of the 4 legs hit</div>${r0.dist.map((v,i)=>`<div class="hb" data-tip="${i} of 4 legs hit: ${pct(v,1)}"><div>${i} of 4</div><div class="bar"><i style="width:${(v*100).toFixed(1)}%"></i></div><div>${pct(v,1)}</div></div>`).join("")}</div></div>`;
  }
  return o;
}
function recRow(label,r){const n=r[0]+r[1];return `<tr><td>${label}</td><td class="num">${r[0]}-${r[1]}${r[2]?"-"+r[2]:""}</td><td class="num">${n?pct(r[0]/n,1):"n/a"}</td><td class="num">${r[3]>=0?"+":""}${r[3].toFixed(2)}</td></tr>`}
function record(){
  const P=DATA.perf, all=P.all?.all?.all;
  let o="";
  if(all){const n=all[0]+all[1];
    o+=`<div class="tiles"><div class="card tile"><div class="k">Live record</div><div class="v">${all[0]}-${all[1]}</div><div class="n">${all[2]} pushes</div></div>
    <div class="card tile"><div class="k">Live hit rate</div><div class="v">${n?pct(all[0]/n,1):"n/a"}</div><div class="n">${n} graded picks</div></div>
    <div class="card tile"><div class="k">Units won or lost</div><div class="v">${all[3]>=0?"+":""}${all[3].toFixed(2)}</div><div class="n">1 unit staked per pick</div></div></div>`;
    o+=`<div class="grid">`+Object.keys(SP).filter(s=>P[s]).map(s=>`<div class="card"><h3>${SP[s]}</h3><table><tr><th>Group</th><th class="num">W-L-P</th><th class="num">Hit rate</th><th class="num">Units</th></tr>
      ${Object.keys(MK).filter(m=>P[s][m]).map(m=>recRow(MK[m],P[s][m].all)).join("")}${TIERS.filter(t=>P[s].all[t]).map(t=>recRow(tierChip(t),P[s].all[t])).join("")}</table></div>`).join("")+`</div>`;
  } else o+=`<div class="warnbox">No live picks have been graded yet. This section fills in automatically after the first games finish and the next update runs. Until then, the backtest below shows how the model would have done on this season's games.</div>`;
  o+=`<h2>Backtest: moneyline picks, 2026-27 season</h2><div class="note">Each game was predicted using only results before it, after a full prior season of training. Bar = actual hit rate. Black marker = what the model predicted. Model only, without sportsbook lines.</div><div class="grid" style="margin-top:8px">`;
  for(const s of ["nfl","nba","cfb","soccer"]){const b=DATA.backtest[s]; if(!b) continue;
    o+=`<div class="card"><h3>${SP[s]} <span class="meta">${b.all[0]} games, ${pct(b.all[1]/b.all[0],1)} overall</span></h3>${TIERS.filter(t=>b[t]).map(t=>{const [n,w,sp]=b[t];return `<div class="hb" data-tip="${t}: hit ${w} of ${n} (${pct(w/n,1)}); model predicted ${pct(sp/n,1)}"><div>${tierChip(t)}</div><div class="bar"><i style="width:${(w/n*100).toFixed(1)}%"></i><u style="left:${(sp/n*100).toFixed(1)}%"></u></div><div>${pct(w/n,1)} <span class="pm">of ${n}</span></div></div>`}).join("")}</div>`}
  o+=`</div>`;
  const PP=DATA.prop_perf||{};
  if(Object.keys(PP).length) o+=`<h2>Player picks record</h2><div class="card"><table><tr><th>Sport</th><th>Confidence</th><th class="num">W-L-P</th><th class="num">Hit rate</th></tr>${Object.entries(PP).flatMap(([s,v])=>Object.entries(v).map(([t,r])=>`<tr><td>${SP[s]||s}</td><td>${tierChip(t)}</td><td class="num">${r[0]}-${r[1]}${r[2]?"-"+r[2]:""}</td><td class="num">${r[0]+r[1]?pct(r[0]/(r[0]+r[1]),1):"n/a"}</td></tr>`)).join("")}</table></div>`;
  else if((DATA.props||[]).length) o+=`<h2>Player picks record</h2><div class="warnbox">Player picks started recently and none have been graded yet. Results appear here after the games finish.</div>`;
  const pp=Object.entries(DATA.parlay_perf);
  if(pp.length) o+=`<h2>Parlay results by type</h2><div class="card"><table><tr><th>Parlay</th><th class="num">Hit</th><th class="num">Issued</th><th class="num">Units</th></tr>${pp.map(([k,r])=>`<tr><td>${h(k)}</td><td class="num">${r[1]}</td><td class="num">${r[0]}</td><td class="num">${r[2]>=0?"+":""}${r[2].toFixed(2)}</td></tr>`).join("")}</table></div>`;
  if(DATA.recent.length) o+=`<h2>Recently graded picks</h2><div class="card" style="overflow:auto"><table><tr><th>Date</th><th>Sport</th><th>Pick</th><th>Game</th><th>Final</th><th class="num">Chance</th><th class="num">Odds</th><th>Result</th></tr>
    ${DATA.recent.slice(0,150).map(p=>`<tr><td>${dt(p.d).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</td><td>${SP[p.sp]}</td><td>${h(p.label)}</td><td>${h(p.game)}</td><td>${h(p.score||"")}</td><td class="num">${pct(p.p)}</td><td class="num">${am(p.odds)}</td><td><span class="res ${p.st}">${p.st==="win"?"&#10003; win":p.st==="loss"?"&#10007; loss":"push"}</span></td></tr>`).join("")}</table></div>`;
  return o;
}
function model(){
  let o=`<div class="note">How the system learns: on every update it replays about 15 months of results in order, and after each finished game it updates each team's strength rating and scoring profile, re-estimates home advantage and how widely results vary, rescales its confidence to match its real hit rate, and re-weights how much to trust itself versus the sportsbook line.</div>
  <h2>Learned settings by league</h2><div class="card" style="overflow:auto"><table><tr><th>League</th><th class="num">Games learned from</th><th class="num">Teams rated</th><th class="num">Home advantage (rating pts)</th><th class="num">Avg total</th><th class="num">Margin spread</th><th class="num">Total spread</th><th>Top rated teams</th></tr>
  ${Object.values(DATA.model).map(m=>`<tr><td>${h(m.league)}</td><td class="num">${m.games}</td><td class="num">${m.teams}</td><td class="num">${m.hfa}</td><td class="num">${m.avg}</td><td class="num">${m.sig}</td><td class="num">${m.tsig}</td><td>${m.top.slice(0,5).map(t=>`${h(t[0])} (${t[1]})`).join(", ")}</td></tr>`).join("")}</table></div>
  <h2>Confidence scaling and model weight</h2><div class="card"><table><tr><th>Sport and bet type</th><th class="num">Results used</th><th class="num">Confidence scaling</th><th class="num">Weight on model vs sportsbook</th></tr>`;
  const keys=new Set([...Object.keys(DATA.calib),...["nfl","nba","cfb","soccer"].flatMap(s=>["ml","spread","total"].map(m=>s+":"+m))]);
  for(const k of keys){const [s,m]=k.split(":"),c=DATA.calib[k]||{a:1,n:0};o+=`<tr><td>${SP[s]} ${MK[m]}</td><td class="num">${c.n}</td><td class="num">${c.a.toFixed(2)}</td><td class="num">${pct(DATA.blend[k]??DATA.default_blend[m])}${DATA.blend[k]==null?" (starting value)":""}</td></tr>`}
  o+=`</table><div class="pm" style="margin-top:6px">Scaling above 1.00 means the model was under-confident and is stretched; below 1.00 it was over-confident and is pulled back. Model weight is re-fitted once 40 live results with sportsbook prices are graded.</div></div>
  <h2>Update log</h2><div class="card"><table>${DATA.log.map(l=>`<tr><td style="white-space:nowrap">${dt(l.t).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</td><td>${h(l.msg)}</td></tr>`).join("")}</table></div>`;
  return o;
}
function slip(){
  const el=$("#slip"); if(!S.slip.length){el.style.display="none";return}
  el.style.display="block";
  const p=S.slip.reduce((a,l)=>a*l.p,1), d=S.slip.reduce((a,l)=>a*dec(l.odds),1), dup=new Set(S.slip.map(l=>l.eid)).size<S.slip.length;
  el.innerHTML=`<div class="gh"><h3>Your parlay slip (${S.slip.length})</h3><button class="x" data-clear="1">Clear</button></div>
  ${S.slip.map(l=>`<div class="leg"><div><b>${h(l.label)}</b><small>${h(l.game)}</small></div><div style="white-space:nowrap">${pct(l.p)} &middot; ${am(l.odds)} <button class="x" data-add="${l.id}">&#10005;</button></div></div>`).join("")}
  ${S.slip.length>1?`<div class="pcard"><div class="big"><div><b>${pct(p,1)}</b><span>chance all hit</span></div><div><b>${am(toAm(d))}</b><span>odds</span></div><div><b>${(p*d-1>=0?"+":"")+((p*d-1)*100).toFixed(1)}%</b><span>expected value</span></div></div></div>`:`<div class="pm">Add another pick to form a parlay.</div>`}
  ${dup?`<div class="warnbox">Two legs are from the same game. Their outcomes are linked, so the combined chance shown is only approximate, and most sportsbooks price these differently.</div>`:""}
  <div class="row">Stake $ <input type="number" min="1" value="${S.slipStake}" data-stake="1"> <b>returns $${(S.slipStake*d).toFixed(2)}</b></div>`;
}
function render(){
  const grp=GROUPS.find(g=>g[3].includes(S.tab))||GROUPS[0], label=Object.fromEntries(TABS);
  $("#nav").innerHTML=GROUPS.map(g=>`<button class="${g===grp?"on":""}" data-tab="${g[2]}" ${g===grp?'aria-current="page"':""}>${ICON[g[2]]||""}${g[1]}</button>`).join("");
  $("#sub").innerHTML=grp[3].length>1?grp[3].map(k=>{const n=["nfl","nba","cfb","soccer"].includes(k)?` <span class="cnt">${DATA.games.filter(g=>g.sp===k).length}</span>`:"";return `<button class="${S.tab===k?"on":""}" data-tab="${k}">${ICON[k]||""}${label[k]}${n}</button>`}).join(""):"";
  $("#sub").style.display=grp[3].length>1?"flex":"none";
  const m=$("#main"), changed=S.lastTab!==S.tab, hadFocus=document.activeElement&&document.activeElement.id==="q";
  if(changed){m.style.animation="none"; void m.offsetWidth; m.style.animation=""; document.body.classList.remove("noanim"); setTimeout(()=>document.body.classList.add("noanim"),1300)}
  S.lastTab=S.tab;
  m.innerHTML=(DATA.notices||[]).map(n=>`<div class="warnbox"><b>Heads up.</b> ${h(n)}</div>`).join("")+(S.tab==="board"?board():S.tab==="odds"?bestOdds():S.tab==="parlays"?parlays():S.tab==="trending"?trending():S.tab==="leaders"?leaders():S.tab==="copy"?copyTab():S.tab==="record"?record():S.tab==="model"?model():sportTab(S.tab))+
   `<footer><b>EdgeEngine</b> &middot; Probabilities are estimates from a statistical model and sportsbook prices. No pick is guaranteed, and past results do not ensure future ones. For entertainment and analysis; bet only what you can afford to lose. If gambling is causing problems, call 1-800-GAMBLER (US).</footer>`;
  if(hadFocus){const q=$("#q"); if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
  slip();
}
document.addEventListener("click",e=>{ if(!DATA) return;
  const t=e.target.closest("[data-tab],[data-set],[data-add],[data-clear],[data-reset]"); if(!t) return;
  if(t.dataset.reset){S.q="";S.tier="all";S.mkt="all";S.day="all";S.comp="all";render();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;window.scrollTo(0,0)}
  else if(t.dataset.set){const k=t.dataset.set;S[k]=k==="slate"?+t.dataset.v:t.dataset.v}
  else if(t.dataset.add){const id=t.dataset.add,i=S.slip.findIndex(x=>x.id===id); if(i>=0)S.slip.splice(i,1); else{const p=allPicks().find(x=>x.id===id)||(DATA.props||[]).find(x=>x.id===id); if(p&&p.odds!=null)S.slip.push(p)}}
  else if(t.dataset.clear){S.slip=[]}
  render();
});
document.addEventListener("change",e=>{if(e.target.dataset.sel==="stake"){S.stake=+e.target.value;render()} if(e.target.dataset.sel==="comp"){S.comp=e.target.value;render()} if(e.target.dataset.sel==="tier"||e.target.dataset.sel==="mkt"){S[e.target.dataset.sel]=e.target.value;render()} if(e.target.dataset.stake){S.slipStake=Math.max(1,+e.target.value||1);slip()}});
let qTimer; document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;clearTimeout(qTimer);qTimer=setTimeout(render,180)}});
document.addEventListener("toggle",e=>{const d=e.target; if(d.dataset&&d.dataset.gid){d.open?S.open.add(d.dataset.gid):S.open.delete(d.dataset.gid)} if(d.dataset&&d.dataset.help){S.help=d.open}},true);
if(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches){document.documentElement.dataset.theme="light";document.getElementById("theme").textContent="Dark mode"}
const tip=$("#tip");
document.addEventListener("mousemove",e=>{const t=e.target.closest("[data-tip]"); if(!t||e.target.closest("button")){tip.style.display="none";return}
  tip.textContent=t.dataset.tip;tip.style.display="block";tip.style.left=Math.min(innerWidth-270,e.clientX+12)+"px";tip.style.top=(e.clientY+14)+"px"});
function chrome(){
  const age=(Date.now()-dt(DATA.generated))/60000, live=!!window.EDGE_DATA_URL;
  $("#stamp").textContent=`${live?(age>90?"Data delayed · last update ":"Live · updated "):"Updated "}${dt(DATA.generated).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})} · ${DATA.games.length} games · ${DATA.games.reduce((a,g)=>a+g.picks.length,0)} picks`;
  const t=allPicks().filter(p=>p.odds!=null).sort((a,b)=>b.p-a.p).slice(0,16).map(p=>`<span>${h(SP[p.sp])} &middot; <b>${h(p.label)}</b> <i>${pct(p.p)}</i> ${am(p.odds)}</span>`).join("");
  const el=$("#ticker"); if(el.dataset.sig!==t){el.dataset.sig=t;el.innerHTML=t+t}
}
async function load(first){
  try{
    const r=await fetch(window.EDGE_DATA_URL+(window.EDGE_DATA_URL.includes("?")?"&":"?")+"t="+Math.floor(Date.now()/120000),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    if(DATA&&d.generated===DATA.generated) return;
    DATA=d; const ids=new Set(allPicks().map(p=>p.id).concat((DATA.props||[]).map(p=>p.id))); S.slip=S.slip.filter(p=>ids.has(p.id));
    const y=scrollY; chrome(); render(); scrollTo(0,y);
  }catch(e){
    if(first) $("#main").innerHTML=`<div class="warnbox">Picks could not be loaded yet (${h(e.message)}). If the site was just set up, the first data update may still be running; this page retries automatically.</div>`;
  }
}
$("#theme").addEventListener("click",e=>{const r=document.documentElement,l=r.dataset.theme==="light";r.dataset.theme=l?"dark":"light";e.target.textContent=l?"Light mode":"Dark mode"});
if(DATA){chrome();render()}
else if(window.EDGE_DATA_URL){$("#stamp").textContent="Loading picks";load(true);setInterval(()=>{if(!document.hidden)load(!DATA)},180000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load(!DATA)})}
else $("#main").innerHTML='<div class="warnbox">No data source configured. Set EDGE_DATA_URL in config.js.</div>';
</script>
