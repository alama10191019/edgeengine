<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdgeEngine | Self-Learning Picks</title>
<style>
:root{color-scheme:dark;--bg:#080c14;--bg2:#0d1422;--surface:#121a2a;--surface2:#1a2438;--line:#26324a;--text:#eef3fb;--text2:#aeb9cc;--muted:#7685a0;
--brand:#3ddc84;--brand2:#22d3ee;--brandink:#04130b;--series:#3ddc84;--track:#222d44;--good:#3ddc84;--goodtx:#5ef0a0;--crit:#ff6b6b;--warn:#fab219;
--t1:#5ef0a0;--t2:#2fbf78;--t3:#1f8f5b;--t4:#2f6650;--nfl:#3987e5;--nba:#d95926;--soccer:#199e70;--cfb:#c98500;--glow:0 0 0 1px rgba(61,220,132,.25),0 8px 30px rgba(0,0,0,.45)}
:root[data-theme="light"]{color-scheme:light;--bg:#eef1f6;--bg2:#e4e9f1;--surface:#ffffff;--surface2:#f1f4f9;--line:#d5dbe6;--text:#0b1220;--text2:#465166;--muted:#6f7b90;
--brand:#0a8f4f;--brand2:#0891b2;--brandink:#ffffff;--series:#0f9d58;--track:#e2e7ef;--good:#0ca30c;--goodtx:#0a7a3f;--crit:#d03b3b;
--t1:#0b5d36;--t2:#0f8a50;--t3:#35b877;--t4:#8fd9b3;--nfl:#2a78d6;--nba:#eb6834;--soccer:#1baf7a;--cfb:#eda100;--glow:0 0 0 1px rgba(10,143,79,.25),0 8px 24px rgba(20,30,50,.12)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 85% -10%,color-mix(in srgb,var(--brand2) 14%,transparent),transparent 60%),radial-gradient(900px 420px at 0% 0%,color-mix(in srgb,var(--brand) 12%,transparent),transparent 55%),var(--bg);background-attachment:fixed;color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{max-width:1280px;margin:0 auto;padding:18px 20px 0}
.brandrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:46px;height:46px;flex:none;filter:drop-shadow(0 4px 14px color-mix(in srgb,var(--brand) 45%,transparent))}
.wordmark{font-size:26px;font-weight:900;letter-spacing:.02em;font-style:italic;text-transform:uppercase;line-height:1}
.wordmark b{background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{color:var(--text2);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-top:5px}
.live{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--text2)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 70%,transparent);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tbtn{border:1px solid var(--line);background:var(--surface);color:var(--text2);border-radius:999px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}
.ticker{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;white-space:nowrap;position:relative}
.ticker:before{content:"TOP PICKS";position:absolute;left:0;top:0;bottom:0;z-index:2;display:flex;align-items:center;padding:0 12px;font-weight:800;font-size:11px;letter-spacing:.12em;color:var(--brandink);background:linear-gradient(90deg,var(--brand),var(--brand2))}
.ticker .run{display:inline-block;padding:7px 0 7px 110px;animation:tick 70s linear infinite}
.ticker:hover .run{animation-play-state:paused}
.ticker span{margin-right:34px;font-size:13px;color:var(--text2)}.ticker span b{color:var(--text)}.ticker span i{font-style:normal;color:var(--goodtx);font-weight:700}
@keyframes tick{to{transform:translateX(-50%)}}
h2{font-size:15px;margin:26px 0 10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;display:flex;align-items:center;gap:10px}
h2:before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--brand),var(--brand2))}
h3{font-size:14px;margin:0 0 6px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding:6px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px);position:sticky;top:8px;z-index:5}
nav button{display:flex;align-items:center;gap:7px;background:none;border:0;border-radius:10px;color:var(--text2);padding:8px 12px;font:inherit;font-weight:700;cursor:pointer;transition:background .15s,color .15s,transform .15s}
nav button:hover{background:var(--surface2);color:var(--text)}
nav button.on{color:var(--brandink);background:linear-gradient(90deg,var(--brand),var(--brand2));box-shadow:0 4px 16px color-mix(in srgb,var(--brand) 35%,transparent)}
nav button svg{width:16px;height:16px;flex:none}
nav .cnt{font-size:11px;font-weight:800;padding:1px 6px;border-radius:999px;background:color-mix(in srgb,currentColor 16%,transparent)}
main{max-width:1280px;margin:0 auto;padding:16px 20px 130px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text2);border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--brand);color:var(--text)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-right:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}
.card{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 80%,var(--bg2)));border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;transition:transform .18s,box-shadow .18s,border-color .18s}
.grid>.card:hover{transform:translateY(-3px);box-shadow:var(--glow);border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.game{overflow:hidden}.game:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--sp)}
.gh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.match{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tm{display:flex;align-items:center;gap:9px;margin:3px 0;font-weight:700;font-size:15px}
.av{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:10px;font-weight:900;letter-spacing:.02em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.meta{color:var(--muted);font-size:12px;font-weight:500}
.lgtag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}
.lgtag i{width:8px;height:8px;border-radius:2px;background:var(--sp)}
.proj{margin-top:8px;padding:7px 10px;border-radius:9px;background:var(--surface2);color:var(--text2);font-size:12px}
.pick{display:grid;grid-template-columns:1fr 86px 58px 32px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pick:first-of-type{margin-top:8px}
.pl{font-weight:700}.pm{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--series),var(--brand2));transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.pct{font-weight:900;font-size:17px;text-align:right;font-variant-numeric:tabular-nums}
.odds{text-align:right;font-variant-numeric:tabular-nums;color:var(--text2);font-weight:600}
.tier{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--text2);border:1px solid var(--line);border-radius:999px;padding:1px 8px 1px 6px;background:var(--surface2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.add{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--text);cursor:pointer;font-weight:800;transition:all .15s}
.add:hover:not(:disabled){border-color:var(--brand);color:var(--brand);transform:scale(1.08)}.add:disabled{opacity:.35;cursor:default}
.add.on{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:var(--brandink)}
details{margin-top:8px}summary{cursor:pointer;color:var(--text2);font-size:13px}
details ul{margin:6px 0 0;padding-left:18px;color:var(--text2);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0}
.tile .v{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}.tile .k{color:var(--text2);font-size:13px}.tile .n{color:var(--muted);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:color-mix(in srgb,var(--surface2) 60%,transparent)}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:20px 22px;margin:14px 0;border-radius:18px;border:1px solid color-mix(in srgb,var(--brand) 40%,var(--line));background:linear-gradient(120deg,color-mix(in srgb,var(--brand) 16%,var(--surface)),var(--surface) 55%,color-mix(in srgb,var(--brand2) 14%,var(--surface)));box-shadow:var(--glow)}
.hero .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--goodtx)}
.hero .big{font-size:28px;font-weight:900;font-style:italic;text-transform:uppercase;line-height:1.1;margin:4px 0}
.hero .stats{display:flex;gap:22px;flex-wrap:wrap}.hero .stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.hero .stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ring{width:112px;height:112px;position:relative;flex:none}.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}.ring .bg{stroke:var(--track)}.ring .fg{stroke:url(#rg);animation:dash 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes dash{from{stroke-dashoffset:302}}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:900}
.pcard{overflow:hidden}.pcard:after{content:"";position:absolute;left:14px;right:14px;top:0;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.pcard .big{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px dashed var(--line)}.pcard .big div{min-width:70px}.pcard .big b{display:block;font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}
.pcard .big span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sg{display:grid;grid-template-columns:1fr 52px 58px 64px;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:13px}.sg .pct{font-size:14px}
.sgp{margin-top:8px;padding:2px 10px 6px;border-radius:10px;background:color-mix(in srgb,var(--surface2) 70%,transparent)}
.leg{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.leg small{color:var(--muted);display:block}
.res{font-weight:800}.res.win{color:var(--goodtx)}.res.loss{color:var(--crit)}
.note{color:var(--text2);font-size:13px}.warnbox{border-left:3px solid var(--warn);background:var(--surface);padding:9px 12px;border-radius:6px;color:var(--text2);font-size:13px;margin:10px 0}
#slip{position:fixed;right:16px;bottom:16px;width:350px;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid color-mix(in srgb,var(--brand) 45%,var(--line));border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.45);padding:14px 16px;display:none;animation:fade .2s ease;z-index:6}
#slip input{width:70px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--text);font:inherit}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px}
.hb{display:grid;grid-template-columns:130px 1fr 120px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.hb .bar{height:14px;margin:0;position:relative;overflow:visible}.hb .bar i{border-radius:0 4px 4px 0}
.hb .bar u{position:absolute;top:-3px;width:2px;height:20px;background:var(--text)}
#tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);padding:6px 9px;border-radius:8px;font-size:12px;display:none;z-index:9;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.empty{color:var(--muted);padding:24px 0}
select{font:inherit;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
footer{color:var(--muted);font-size:12px;margin-top:30px;padding-top:14px;border-top:1px solid var(--line)}
@media(max-width:720px){.hero{grid-template-columns:1fr}.live{margin-left:0}.grid{grid-template-columns:1fr}#slip{left:8px;right:8px;width:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brandrow">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--brand)"/><stop offset="1" stop-color="var(--brand2)"/></linearGradient></defs>
      <path d="M24 3 42 13.5v21L24 45 6 34.5v-21z" fill="url(#lg)"/><path d="M12 29h6l4-10 5 14 4-9h5" fill="none" stroke="var(--brandink)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><div class="wordmark">Edge<b>Engine</b></div><div class="tagline">Self-learning picks &middot; NFL &middot; NBA &middot; Soccer &middot; College Football</div></div>
    <div class="live"><span class="pill"><span class="pulse"></span><span id="stamp"></span></span><button class="tbtn" id="theme">Light mode</button></div>
  </div>
  <div class="ticker"><div class="run" id="ticker"></div></div>
  <nav id="nav"></nav>
</header>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--brand)"/><stop offset="1" stop-color="var(--brand2)"/></linearGradient></defs></svg>
<main id="main"></main>
<div id="slip"></div>
<div id="tip"></div>
<script src="config.js"></script>
<script>
let DATA=/*__DATA__*/null;  // filled in by the engine (single-file mode) or fetched from EDGE_DATA_URL (hosted mode)
const TABS=[["board","Top Picks"],["nfl","NFL"],["nba","NBA"],["soccer","Soccer"],["cfb","College Football"],["parlays","Parlays"],["record","Track Record"],["model","Model & Learning"]];
const TIERS=["Very likely","High","Average","Below average"], TCOL={"Very likely":"--t1","High":"--t2","Average":"--t3","Below average":"--t4"};
const MK={ml:"Moneyline",spread:"Spread",total:"Total"}, SP={nfl:"NFL",nba:"NBA",cfb:"College Football",soccer:"Soccer",all:"All sports"};
const S={tab:"board",day:"all",tier:"all",mkt:"all",comp:"all",slate:0,stake:10,slip:[],slipStake:10};
const TOPC=/UEFA|FIFA|English Premier|^LALIGA$|^Serie A$|^Bundesliga$|^Ligue 1$|^MLS$|International Friendly|Nations League|Copa America|Libertadores|Copa del Rey|FA Cup|Liga MX|Eredivisie|Liga Portugal/;
const $=s=>document.querySelector(s), h=(s)=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=(p,d=0)=>p==null?"n/a":(p*100).toFixed(d)+"%";
const am=o=>o==null?"n/a":(o>0?"+":"")+o;
const dec=o=>o==null?null:1+(o>0?o/100:100/-o);
const toAm=d=>d<=1.0001?null:(d>=2?Math.round((d-1)*100):Math.round(-100/(d-1)));
const dt=iso=>new Date(iso);
const dayKey=iso=>{const d=dt(iso);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayLabel=k=>{const d=new Date(k+"T12:00:00");const t=dayKey(new Date().toISOString());return (k===t?"Today, ":"")+d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})};
const tm=iso=>dt(iso).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const ICON={board:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>',
nfl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20c-1-7 5-17 16-16 1 11-9 17-16 16z"/><path d="M9 15l6-6M11 11l2 2"/></svg>',
nba:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 9.800 0 12.800M18.400 5.600c-3 3-3 9.800 0 12.800"/></svg>',
soccer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8l3.800 2.800-1.500 4.400H9.700l-1.500-4.400zM12 3v5M21 11l-5.200-.200M17 19.500l-2.700-4.300M7 19.500l2.700-4.300M3 11l5.200-.2"/></svg>',
cfb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.500 8-8 9-4.500-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4" stroke-linecap="round"/></svg>',
parlays:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 7h16v4a2 2 0 000 4v4H4v-4a2 2 0 000-4z"/><path d="M14 7v12" stroke-dasharray="2 2.500"/></svg>',
record:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 4-6"/></svg>',
model:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="6" cy="6" r="2.200"/><circle cx="18" cy="6" r="2.200"/><circle cx="12" cy="18" r="2.200"/><circle cx="12" cy="11" r="1.600"/><path d="M7.600 7.500l3.200 2.500M16.400 7.500l-3.200 2.500M12 12.600v3.200"/></svg>'};
const hue=str=>{let x=7;for(const c of str)x=(x*31+c.charCodeAt(0))%360;return x};
const av=t=>`<span class="av" style="background:linear-gradient(135deg,hsl(${hue(t.n)} 62% 42%),hsl(${(hue(t.n)+38)%360} 66% 30%))">${h((t.a||"").slice(0,4))}</span>`;
const ring=p=>`<div class="ring"><svg viewBox="0 0 112 112" width="112" height="112"><circle class="bg" cx="56" cy="56" r="48"/><circle class="fg" cx="56" cy="56" r="48" stroke-dasharray="302" stroke-dashoffset="${(302*(1-p)).toFixed(1)}"/></svg><div>${pct(p)}</div></div>`;
const tierChip=t=>`<span class="tier"><span class="dot" style="background:var(${TCOL[t]})"></span>${t}</span>`;
const allPicks=()=>DATA.games.flatMap(g=>g.picks.map(p=>({...p,league:g.league})));

function pickRow(p,showGame){
  const on=S.slip.some(x=>x.id===p.id);
  return `<div class="pick" data-tip="Model alone: ${pct(p.pm,1)} | Sportsbook implied: ${pct(p.pk,1)} | Final: ${pct(p.p,1)}${p.ev!=null?" | Expected value per $1: "+(p.ev>=0?"+":"")+p.ev.toFixed(3):""}">
    <div><div class="pl">${h(p.label)} <span class="pm">${MK[p.mkt]}</span></div>
      ${showGame?`<div class="pm">${h(p.game)} &middot; ${h(p.league||"")} &middot; ${tm(p.d)}</div>`:""}
      <div class="bar"><i style="width:${Math.max(2,(p.p*100)).toFixed(0)}%"></i></div>
      <div style="margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">${tierChip(p.tier)}${p.edge!=null?` <span class="pm" style="white-space:nowrap">edge ${p.edge>=0?"+":""}${(p.edge*100).toFixed(1)} pts</span>`:""}</div></div>
    <div class="pct">${pct(p.p)}</div><div class="odds">${am(p.odds)}</div>
    <button class="add ${on?"on":""}" data-add="${p.id}" title="Add to parlay slip" ${p.odds==null?"disabled":""}>${on?"&#10003;":"+"}</button></div>`;
}
function sgpRows(g){

function chrome(){
  const age=(Date.now()-dt(DATA.generated))/60000, live=!!window.EDGE_DATA_URL;
  $("#stamp").textContent=`${live?(age>90?"Data delayed · last update ":"Live · updated "):"Updated "}${dt(DATA.generated).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})} · ${DATA.games.length} games · ${DATA.games.reduce((a,g)=>a+g.picks.length,0)} picks`;
  const t=allPicks().filter(p=>p.odds!=null).sort((a,b)=>b.p-a.p).slice(0,16).map(p=>`<span>${h(SP[p.sp])} &middot; <b>${h(p.label)}</b> <i>${pct(p.p)}</i> ${am(p.odds)}</span>`).join("");
  const el=$("#ticker"); if(el.dataset.sig!==t){el.dataset.sig=t;el.innerHTML=t+t}
}
async function load(first){
  try{
    const r=await fetch(window.EDGE_DATA_URL+(window.EDGE_DATA_URL.includes("?")?"&":"?")+"t="+Math.floor(Date.now()/120000),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    if(DATA&&d.generated===DATA.generated) return;
    DATA=d; const ids=new Set(allPicks().map(p=>p.id)); S.slip=S.slip.filter(p=>ids.has(p.id));
    const y=scrollY; chrome(); render(); scrollTo(0,y);
  }catch(e){
    if(first) $("#main").innerHTML=`<div class="warnbox">Picks could not be loaded yet (${h(e.message)}). If the site was just set up, the first data update may still be running; this page retries automatically.</div>`;
  }
}
$("#theme").addEventListener("click",e=>{const r=document.documentElement,l=r.dataset.theme==="light";r.dataset.theme=l?"dark":"light";e.target.textContent=l?"Light mode":"Dark mode"});
if(DATA){chrome();render()}
else if(window.EDGE_DATA_URL){$("#stamp").textContent="Loading picks";load(true);setInterval(()=>{if(!document.hidden)load(!DATA)},180000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load(!DATA)})}
else $("#main").innerHTML='<div class="warnbox">No data source configured. Set EDGE_DATA_URL in config.js.</div>';
</script>
</body>
</html>
