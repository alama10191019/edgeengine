# Netlify serves the static page in /site. Nothing is built.
[build]
  publish = "site"
  command = ""

# /community-picks opens the Community section of the same page
[[redirects]]
  from = "/community-picks"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
